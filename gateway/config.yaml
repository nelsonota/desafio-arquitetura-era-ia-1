router_settings:
  num_retries: 0
  retry_after: 0.5
  retry_policy:
    InternalServerErrorRetries: 1
    ServiceUnavailableErrorRetries: 1
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 0
    DefaultRetries: 0
  model_group_retry_policy:
    reply-suggestion:
      InternalServerErrorRetries: 0
      ServiceUnavailableErrorRetries: 0
      RateLimitErrorRetries: 0
      TimeoutErrorRetries: 0
      DefaultRetries: 0
    reply-suggestion-tech:
      InternalServerErrorRetries: 0
      ServiceUnavailableErrorRetries: 0
      RateLimitErrorRetries: 0
      TimeoutErrorRetries: 0
      DefaultRetries: 0
    reply-suggestion-mini:
      InternalServerErrorRetries: 0
      ServiceUnavailableErrorRetries: 0
      RateLimitErrorRetries: 0
      TimeoutErrorRetries: 0
      DefaultRetries: 0
  max_fallbacks: 2
  timeout: 14
  fallbacks:
    - ticket-classification: [ticket-classification-tech, ticket-classification-mini]
    - order-extraction: [order-extraction-tech]
    - reply-suggestion: [reply-suggestion-tech, reply-suggestion-mini]
    - ticket-topics: [ticket-topics-tech, ticket-topics-mini]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
